image: node:24.15.0

clone:
    depth: 5000       # include the last five hundred commits

pipelines:
    # Start pipeline with tag to build examples zips and copy them to the Bitbucket download folder
    tags:
        'v3.*.*':
            -   step:
                    name: build examples zip
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - export NODE_OPTIONS=--openssl-legacy-provider
                        - npm install
                        - npm run buildExamples
                        - apt-get update
            -   step:
                    name: deploy examples zip
                    caches:
                        - node
                    script:
                        - apt-get install -y curl
                        # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            echo "[DRY-RUN] Would upload $zipFilePath to Bitbucket downloads";
                            done
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - echo "[DRY-RUN] Would push docs snippet commit to origin"
                        - 'echo "[DRY-RUN] Would run: mike deploy $BITBUCKET_TAG"'
                        - echo "[DRY-RUN] Would move site to $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG"
                        # -   pipe: atlassian/ftp-deploy:0.7.1
                        #     variables:
                        #         USER: $MKDOCS_FTP_NAME
                        #         PASSWORD: $MKDOCS_FTP_PW
                        #         SERVER: $MKDOCS_FTP_SERVER
                        #         REMOTE_PATH: '/$BITBUCKET_TAG'
                        #         LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        #         DEBUG: 'true'
                        #         DELETE_FLAG: 'false'
                        - |
                            IS_LTS_HOTFIX="false"

                            if [ "$BITBUCKET_TAG" = "lts" ]; then
                                LTS_HEADER="$(grep -m1 -E '^## .* v[0-9]+\.[0-9]+\.[0-9]+ \(LTS\)$' CHANGELOG.md || true)"
                                LTS_VERSION="$(echo "$LTS_HEADER" | sed -n 's/^## .* v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) (LTS)$/\1/p')"

                                if [ -z "$LTS_VERSION" ]; then
                                    echo "Could not parse latest LTS version from CHANGELOG.md."
                                    exit 1
                                fi

                                LTS_PATCH="${LTS_VERSION##*.}"
                                if [ "$LTS_PATCH" != "0" ]; then
                                    IS_LTS_HOTFIX="true"
                                fi
                                echo "Detected LTS version v$LTS_VERSION from CHANGELOG.md (hotfix=$IS_LTS_HOTFIX)."
                            else
                                ACTIVE_LTS_SERIES="${ACTIVE_LTS_SERIES:-3.15}"
                                TAG_VERSION="${BITBUCKET_TAG#v}"
                                TAG_MAJOR_MINOR="$(echo "$TAG_VERSION" | cut -d. -f1,2)"
                                TAG_PATCH="$(echo "$TAG_VERSION" | cut -d. -f3)"

                                if [ "$TAG_MAJOR_MINOR" = "$ACTIVE_LTS_SERIES" ] && [ "$TAG_PATCH" != "0" ]; then
                                    IS_LTS_HOTFIX="true"
                                fi
                                echo "Detected version tag $BITBUCKET_TAG (hotfix=$IS_LTS_HOTFIX)."
                            fi

                            if [ "$IS_LTS_HOTFIX" = "true" ]; then
                                echo "LTS hotfix detected. Skip Latest upload."
                            else
                                echo "[DRY-RUN] Would upload Latest docs for $BITBUCKET_TAG to FTP."
                            fi
            -   step:
                    name: deploy on openCode (also latest tag)
                    script:
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - echo "[DRY-RUN] Would push tag $BITBUCKET_TAG to openCode"
                        - echo "[DRY-RUN] Would mirror dev branch to openCode"

                        - echo 'deploy latest tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/latest
                        - echo "[DRY-RUN] Would delete and recreate latest tag on openCode"
                        - echo "[DRY-RUN] Would mirror dev branch to openCode"
        'lts': 
            -   step:
                        name: deploy lts on openCode
                        script:
                            - echo 'remove lts tag in openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - echo "[DRY-RUN] Would delete lts tag on openCode"
                            - echo "[DRY-RUN] Would mirror dev branch to openCode"

                            - echo 'deploy lts to openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - echo "[DRY-RUN] Would push lts tag to openCode"
                            - echo "[DRY-RUN] Would mirror lts branch to openCode"
    custom: # Pipelines that are triggered manually
        npm audit:
            -   step:
                    name: npm audit (security)
                    caches:
                        - node
                    script:
                        - npm install
                        - npm audit --json
        deploy tag on openCode:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: deploy tag on openCode
                    script:
                        - apt-get update && apt-get install -y curl wput jq
                        - git fetch --all --tags
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git checkout tags/$BITBUCKET_TAG
                        - echo "[DRY-RUN] Would push tag $BITBUCKET_TAG to openCode"
                        - echo "[DRY-RUN] Would mirror dev branch to openCode"
        mkdocs version to masterportal.org (no update of latest):
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - echo "[DRY-RUN] Would push docs snippet commit to origin"
                        - 'echo "[DRY-RUN] Would run: mike deploy $BITBUCKET_TAG"'
                        - echo "[DRY-RUN] Would move site to $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG"
                        # -   pipe: atlassian/ftp-deploy:0.7.1
                        #     variables:
                        #         USER: $MKDOCS_FTP_NAME
                        #         PASSWORD: $MKDOCS_FTP_PW
                        #         SERVER: $MKDOCS_FTP_SERVER
                        #         REMOTE_PATH: '/$BITBUCKET_TAG'
                        #         LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        #         DEBUG: 'true'
                        #         DELETE_FLAG: 'false'
        mkdocs latest to masterportal.org:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0 or lts
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - echo "[DRY-RUN] Would push docs snippet commit to origin"
                        - 'echo "[DRY-RUN] Would run: mike deploy $BITBUCKET_TAG"'
                        - |
                            IS_LTS_HOTFIX="false"

                            if [ "$BITBUCKET_TAG" = "lts" ]; then
                                LTS_HEADER="$(grep -m1 -E '^## .* v[0-9]+\.[0-9]+\.[0-9]+ \(LTS\)$' CHANGELOG.md || true)"
                                LTS_VERSION="$(echo "$LTS_HEADER" | sed -n 's/^## .* v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) (LTS)$/\1/p')"

                                if [ -z "$LTS_VERSION" ]; then
                                    echo "Could not parse latest LTS version from CHANGELOG.md."
                                    exit 1
                                fi

                                LTS_PATCH="${LTS_VERSION##*.}"
                                if [ "$LTS_PATCH" != "0" ]; then
                                    IS_LTS_HOTFIX="true"
                                fi
                                echo "Detected LTS version v$LTS_VERSION from CHANGELOG.md (hotfix=$IS_LTS_HOTFIX)."
                            fi

                            if [ "$IS_LTS_HOTFIX" = "true" ]; then
                                echo "LTS hotfix detected. Skip Latest upload."
                            else
                                echo "[DRY-RUN] Would upload Latest docs for $BITBUCKET_TAG to FTP."
                            fi
        validate mkdocs:
            -   step:
                    name: validate mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - python -m venv .venv
                        - source .venv/bin/activate
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - devtools/docsValidation/docsValidation.sh
        mkdocs to bitbucket download:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - echo "[DRY-RUN] Would push docs snippet commit to origin"
                        - 'echo "[DRY-RUN] Would run: mike deploy $BITBUCKET_TAG"'
                        - echo "[DRY-RUN] Would create archive masterportal_docs.zip from generated site"
                        - echo "[DRY-RUN] Would upload masterportal_docs.zip to Bitbucket downloads"
        build and deploy examples zip:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to create examples for, e.g. v3.1.0
            -   step:
                    name: build examples
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - npm install
                        - npm run buildExamples
                        - apt-get update
                        - apt-get install -y curl
                         # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            echo "[DRY-RUN] Would upload $zipFilePath to Bitbucket downloads";
                            done
        deploy lts tag to openCode:
            -   step:
                    name: deploy lts tag to openCode
                    script:
                        - echo 'deploy lts tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/lts
                        - echo "[DRY-RUN] Would push lts tag to openCode"
                        - echo "[DRY-RUN] Would mirror lts branch to openCode"
        remove tag in openCode:
            - variables:
                    - name: BITBUCKET_TAG
            -   step:
                    name: remove tag in openCode
                    script:
                        - echo 'remove tag in openCodeL:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - echo "[DRY-RUN] Would delete tag $BITBUCKET_TAG in openCode"
                        - echo "[DRY-RUN] Would mirror dev branch to openCode"
