image: node:24.15.0

clone:
    depth: 5000       # include the last five hundred commits

pipelines:
    # Start pipeline with tag to build examples zips and copy them to the Bitbucket download folder
    tags:
        'v3.*.*':
            -   step:
                    name: build examples zip
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - export NODE_OPTIONS=--openssl-legacy-provider
                        - npm install
                        - npm run buildExamples
                        - apt-get update
            -   step:
                    name: deploy examples zip
                    caches:
                        - node
                    script:
                        - apt-get install -y curl
                        # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads" --form files=@"$zipFilePath" --verbose;
                            done
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - mkdir -p docs/_snippets
                        - RELEASE_VERSION="${BITBUCKET_TAG#v}" && if grep -q "^## .* v${RELEASE_VERSION}.*LTS.*$" CHANGELOG.md 2>/dev/null; then printf '# Welcome to the Masterportal Documentation (%s (lts))\n' "$RELEASE_VERSION" > docs/_snippets/index_title.md; else printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md; fi
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$BITBUCKET_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
                        - RELEASE_VERSION="${BITBUCKET_TAG#v}"
                        - CHANGELOG_RELEASE_HEADER="$(grep -m1 -E "^## .* v${RELEASE_VERSION}( \(LTS\))?$" CHANGELOG.md || true)"
                        - if [ -z "$CHANGELOG_RELEASE_HEADER" ]; then echo "Could not find release headline for $BITBUCKET_TAG in CHANGELOG.md." && exit 1; fi
                        - IS_RELEASE_LTS="false"
                        - if echo "$CHANGELOG_RELEASE_HEADER" | grep -q ' (LTS)$'; then IS_RELEASE_LTS="true"; fi
                        - RELEASE_PATCH="${RELEASE_VERSION##*.}"
                        - IS_LTS_HOTFIX="false"
                        - if [ "$IS_RELEASE_LTS" = "true" ] && [ "$RELEASE_PATCH" != "0" ]; then IS_LTS_HOTFIX="true"; fi
                        - if [ "$IS_LTS_HOTFIX" = "true" ]; then echo "LTS hotfix detected for $BITBUCKET_TAG - skip Latest docs upload." && exit 0; fi
                        - mv $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG $BITBUCKET_CLONE_DIR/Latest
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/Latest'
                                LOCAL_PATH: '$BITBUCKET_CLONE_DIR/Latest'
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
            # -   step:
            #         name: deploy on openCode (also latest tag)
            #         script:
            #             - echo 'deploy to opencode:'$BITBUCKET_TAG
            #             - git fetch --all --tags
            #             - git checkout tags/$BITBUCKET_TAG
            #             - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git $BITBUCKET_TAG
            #             - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
            #             - cd masterportal
            #             - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f

            #             - echo 'deploy latest tag to openCode'
            #             - git fetch --all --tags
            #             - git checkout tags/latest
            #             - git push --delete https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git latest
            #             - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git latest
            #             - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
            #             - cd masterportal
            #             - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f
            -   step:
                    name: deploy on NEW openCode (also latest tag)
                    script:
                        - export ENCODED_USER=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_User))")
                        - export ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_Password))")
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git -f

                        - echo 'deploy latest tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/latest
                        - git push --delete https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git latest
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git latest
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git -f

        # 'lts': 
        #     -   step:
        #                 name: deploy lts on openCode
        #                 script:
        #                     - echo 'remove lts tag in openCode'
        #                     - git fetch --all --tags
        #                     - git checkout tags/lts
        #                     - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git :refs/tags/lts

        #                     - echo 'delete lts branch in openCode'
        #                     - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git --delete refs/heads/lts

        #                     - echo 'deploy lts tag to openCode'
        #                     - git fetch --all --tags
        #                     - git checkout tags/lts
        #                     - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git refs/tags/lts
                            
        #                     - echo 'create lts branch from lts tag and transfer it to openCode'
        #                     - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
        #                     - cd masterportal
        #                     - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git HEAD:refs/heads/lts -f
        'lts': 
            -   step:
                        name: deploy lts on new openCode
                        script:
                            - export ENCODED_USER=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_User))")
                            - export ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_Password))")
                            - echo 'remove lts tag in new openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git :refs/tags/lts

                            - echo 'delete lts branch in new openCode'
                            - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git --delete refs/heads/lts

                            - echo 'deploy lts tag to new openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git refs/tags/lts
                            
                            - echo 'create lts branch from lts tag and transfer it to new openCode'
                            - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                            - cd masterportal
                            - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git HEAD:refs/heads/lts -f

    custom: # Pipelines that are triggered manually
        npm audit:
            -   step:
                    name: npm audit (security)
                    caches:
                        - node
                    script:
                        - npm install
                        - npm audit --json
        osv scan (security):
            -   step:
                    name: OSV scan + create Jira ticket (security)
                    caches:
                        - node
                    script:
                        - npm install
                        - curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
                        - chmod +x /usr/local/bin/osv-scanner
                        - /usr/local/bin/osv-scanner scan -r . --format json > osv-result.json || true
                        - node -e "const r=require('./osv-result.json'); console.log('OSV scan finished'); console.log('Results:', r.results?.length || 0);"
                        - export JIRA_PROJECT_KEY="BG"
                        - export JIRA_BASE_URL="https://lgv-hamburg.atlassian.net"
                        - export JIRA_ISSUE_TYPE="Task"
                        - export JIRA_USER_EMAIL="geodatenanwendungen@gv.hamburg.de"
                        - echo 'JIRA_PROJECT_KEY='$JIRA_PROJECT_KEY
                        - echo 'JIRA_BASE_URL='$JIRA_BASE_URL
                        - echo 'JIRA_ISSUE_TYPE='$JIRA_ISSUE_TYPE
                        - echo 'JIRA_USER_EMAIL='$JIRA_USER_EMAIL
                        - node devtools/security/createJiraTicketFromOsv.mjs
                    artifacts:
                        - osv-result.json
        deploy tag on new openCode:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: deploy tag on new openCode
                    script:
                        - apt-get update && apt-get install -y curl wput jq
                        - git fetch --all --tags
                        - echo 'deploy to new opencode:'$BITBUCKET_TAG
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git -f
        mkdocs version to masterportal.org (no update of latest):
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$BITBUCKET_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
        mkdocs latest to masterportal.org:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/Latest
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/Latest'
                                LOCAL_PATH: '$BITBUCKET_CLONE_DIR/Latest'
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'                                
        validate mkdocs:
            -   step:
                    name: validate mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - python -m venv .venv
                        - source .venv/bin/activate
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - devtools/docsValidation/docsValidation.sh
        mkdocs to bitbucket download:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - mike deploy $BITBUCKET_TAG
                        - zip -r masterportal_docs.zip /opt/atlassian/pipelines/agent/build/site
                        - curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads/" --form files=@"masterportal_docs.zip" --verbose;
        build and deploy examples zip:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to create examples for, e.g. v3.1.0
            -   step:
                    name: build examples
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - npm install
                        - npm run buildExamples
                        - apt-get update
                        - apt-get install -y curl
                         # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads" --form files=@"$zipFilePath" --verbose;
                            done
        deploy tag and branch with same name to new openCode:
            - variables:
                    - name: BITBUCKET_TAG        
            -   step:
                    name: 'deploy tag to new openCode'
                    script:
                        - echo 'deploy tag to new openCode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git refs/tags/$BITBUCKET_TAG
                        - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git HEAD:refs/heads/$BITBUCKET_TAG -f
        deploy lts tag and lts branch to new openCode:
            -   step:
                    name: deploy lts tag to new openCode
                    script:
                        - echo 'deploy lts tag to new openCode'
                        - git fetch --all --tags
                        - git checkout tags/lts
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git refs/tags/lts
                        - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git HEAD:refs/heads/lts -f
        remove tag in new openCode:
            - variables:
                    - name: BITBUCKET_TAG
            -   step:
                    name: remove tag in new openCode
                    script:
                        - echo 'remove tag in new openCode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git :refs/tags/$BITBUCKET_TAG
        delete branch in new openCode:
            - variables:
                    - name: BRANCH_NAME
            -   step:
                    name: delete branch in new openCode
                    script:
                        - echo 'delete branch in openCode:'$BRANCH_NAME
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git --delete refs/heads/$BRANCH_NAME
        deploy on new openCode (also latest tag):
            - variables:
                - name: BITBUCKET_TAG
            - step:
                    name: deploy on NEW openCode (also latest tag)
                    script:
                        - export ENCODED_USER=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_User))")
                        - export ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.OpenCode_Password))")
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git -f

                        - echo 'deploy latest tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/latest
                        - git push --delete https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git latest
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git latest
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$ENCODED_USER:$ENCODED_PASSWORD@gitlab.opencode.de/lgvhh/urban-data-solutions/masterportal.git -f
        deploy dev Branch to new openCode: 
                    -   step:
                            name: 'deploy dev Branch to new openCode'
                            script:
                                - echo 'deploy dev Branch to new openCode'
                                - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                                - cd masterportal
                                - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/lgvhh/urban-data-solutions/pr-migration-test.git HEAD:refs/heads/dev -f
