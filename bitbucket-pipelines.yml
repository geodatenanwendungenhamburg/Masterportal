image: node:24.15.0

clone:
    depth: 5000       # include the last five hundred commits

pipelines:
    # Start pipeline with tag to build examples zips and copy them to the Bitbucket download folder
    tags:
        'v3.*.*':
            -   step:
                    name: build examples zip
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - export NODE_OPTIONS=--openssl-legacy-provider
                        - npm install
                        - npm run buildExamples
                        - apt-get update
            -   step:
                    name: deploy examples zip
                    caches:
                        - node
                    script:
                        - apt-get install -y curl
                        # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads" --form files=@"$zipFilePath" --verbose;
                            done
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$BITBUCKET_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
                        - mv $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG $BITBUCKET_CLONE_DIR/Latest
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/Latest'
                                LOCAL_PATH: '$BITBUCKET_CLONE_DIR/Latest'
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
            -   step:
                    name: deploy on openCode (also latest tag)
                    script:
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f

                        - echo 'deploy latest tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/latest
                        - git push --delete https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git latest
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git latest
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f
        'lts': 
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/lts
                        - FIRST_RELEASE_HEADER="$(grep -m1 -E '^## .* v[0-9]+\.[0-9]+\.[0-9]+( \(LTS\))?$' CHANGELOG.md || true)"
                        - CHANGELOG_VERSION="$(echo "$FIRST_RELEASE_HEADER" | sed -n 's/^## .* v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\( (LTS)\)\?$/\1/p')"
                        - IS_CHANGELOG_LTS="false"
                        - if [ -z "$CHANGELOG_VERSION" ]; then echo "Could not parse first release headline from CHANGELOG.md." && exit 1; fi
                        - if echo "$FIRST_RELEASE_HEADER" | grep -q ' (LTS)$'; then IS_CHANGELOG_LTS="true"; fi
                        - CHANGELOG_PATCH="${CHANGELOG_VERSION##*.}"
                        - IS_LTS_HOTFIX="false"
                        - if [ "$IS_CHANGELOG_LTS" = "true" ] && [ "$CHANGELOG_PATCH" != "0" ]; then IS_LTS_HOTFIX="true"; fi
                        - if [ "$IS_LTS_HOTFIX" = "true" ]; then echo "LTS hotfix detected (v$CHANGELOG_VERSION) - skip mkdocs deployment."; exit 0; fi
                        - export RELEASE_TAG="v$CHANGELOG_VERSION"
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$RELEASE_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $RELEASE_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $RELEASE_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$RELEASE_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$RELEASE_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$RELEASE_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
                        - echo "Upload Latest for LTS release ($RELEASE_TAG)."
                        - mv $BITBUCKET_CLONE_DIR/$RELEASE_TAG $BITBUCKET_CLONE_DIR/Latest
                        - find "$BITBUCKET_CLONE_DIR/Latest" -type f | while read -r file; do
                            rel_path="${file#$BITBUCKET_CLONE_DIR/Latest/}"
                            curl --user "$MKDOCS_FTP_NAME:$MKDOCS_FTP_PW" --ftp-create-dirs -T "$file" "ftp://$MKDOCS_FTP_SERVER/Latest/$rel_path"
                          done
            -   step:
                        name: deploy lts on openCode
                        script:
                            - echo 'remove lts tag in openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - git push --delete https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git lts
                            - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                            - cd masterportal
                            - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f

                            - echo 'deploy lts to openCode'
                            - git fetch --all --tags
                            - git checkout tags/lts
                            - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git lts
                            - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                            - cd masterportal
                            - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git HEAD:refs/heads/lts -f
    custom: # Pipelines that are triggered manually
        npm audit:
            -   step:
                    name: npm audit (security)
                    caches:
                        - node
                    script:
                        - npm install
                        - npm audit --json
        deploy tag on openCode:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: deploy tag on openCode
                    script:
                        - apt-get update && apt-get install -y curl wput jq
                        - git fetch --all --tags
                        - echo 'deploy to opencode:'$BITBUCKET_TAG
                        - git checkout tags/$BITBUCKET_TAG
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f
        mkdocs version to masterportal.org (no update of latest):
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$BITBUCKET_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$BITBUCKET_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
        mkdocs latest to masterportal.org:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq  && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $BITBUCKET_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/Latest
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/Latest'
                                LOCAL_PATH: '$BITBUCKET_CLONE_DIR/Latest'
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'                                
        validate mkdocs:
            -   step:
                    name: validate mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - python -m venv .venv
                        - source .venv/bin/activate
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - devtools/docsValidation/docsValidation.sh
        mkdocs to bitbucket download:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to publish docs for, e.g. v3.1.0
            -   step:
                    name: create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$BITBUCKET_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $BITBUCKET_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $BITBUCKET_TAG
                        - zip -r masterportal_docs.zip /opt/atlassian/pipelines/agent/build/site
                        - curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads/" --form files=@"masterportal_docs.zip" --verbose;
        build and deploy examples zip:
            - variables:
                - name: BITBUCKET_TAG
                  description: tag to create examples for, e.g. v3.1.0
            -   step:
                    name: build examples
                    caches:
                        - node
                    artifacts:
                        - dist/**
                    script:
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - npm install
                        - npm run buildExamples
                        - apt-get update
                        - apt-get install -y curl
                         # find all zip folders in dist folder, loop through the results and post the zips to the BB download folder
                        - for zipFilePath in $(find dist -name \*.zip); do
                            curl -X POST --user "$bbapi_name:$bbapi_key" "https://api.bitbucket.org/2.0/repositories/geowerkstatt-hamburg/masterportal/downloads" --form files=@"$zipFilePath" --verbose;
                            done
        deploy lts tag to openCode:
            -   step:
                    name: deploy lts tag to openCode
                    script:
                        - echo 'deploy lts tag to openCode'
                        - git fetch --all --tags
                        - git checkout tags/lts
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git lts
                        - git clone --single-branch --branch lts https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git HEAD:refs/heads/lts -f
        remove tag in openCode:
            - variables:
                    - name: BITBUCKET_TAG
            -   step:
                    name: remove tag in openCode
                    script:
                        - echo 'remove tag in openCodeL:'$BITBUCKET_TAG
                        - git fetch --all --tags
                        - git checkout tags/$BITBUCKET_TAG
                        - git push --delete https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git $BITBUCKET_TAG
                        - git clone --single-branch --branch dev https://geowerkstatt@bitbucket.org/geowerkstatt-hamburg/masterportal.git
                        - cd masterportal
                        - git push https://$OpenCode_User:$OpenCode_Password@gitlab.opencode.de/geowerkstatt-hamburg/masterportal.git -f
        lts tag test:
            -   step:
                    name: lts tag test create mkdocs
                    image: python:3.8
                    caches:
                        - pip
                    script:
                        - apt-get update && apt-get install zip && apt-get install -y curl wput jq && apt-get install zip
                        - pip install -r devtools/docsValidation/python-dependencies.txt
                        - git fetch --all --tags
                        - git checkout tags/lts
                        - FIRST_RELEASE_HEADER="$(grep -m1 -E '^## .* v[0-9]+\.[0-9]+\.[0-9]+( \(LTS\))?$' CHANGELOG.md || true)"
                        - CHANGELOG_VERSION="$(echo "$FIRST_RELEASE_HEADER" | sed -n 's/^## .* v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\( (LTS)\)\?$/\1/p')"
                        - IS_CHANGELOG_LTS="false"
                        - if [ -z "$CHANGELOG_VERSION" ]; then echo "Could not parse first release headline from CHANGELOG.md." && exit 1; fi
                        - if echo "$FIRST_RELEASE_HEADER" | grep -q ' (LTS)$'; then IS_CHANGELOG_LTS="true"; fi
                        - CHANGELOG_PATCH="${CHANGELOG_VERSION##*.}"
                        - IS_LTS_HOTFIX="false"
                        - if [ "$IS_CHANGELOG_LTS" = "true" ] && [ "$CHANGELOG_PATCH" != "0" ]; then IS_LTS_HOTFIX="true"; fi
                        - if [ "$IS_LTS_HOTFIX" = "true" ]; then echo "LTS hotfix detected (v$CHANGELOG_VERSION) - skip mkdocs deployment."; exit 0; fi
                        - export RELEASE_TAG="v$CHANGELOG_VERSION"
                        - echo "[DRY-RUN][CHECK] tag=$RELEASE_TAG"
                        - echo "[DRY-RUN][CHECK] changelog_version=v$CHANGELOG_VERSION lts=$IS_CHANGELOG_LTS hotfix=$IS_LTS_HOTFIX"
                        - mkdir -p docs/_snippets
                        - printf '# Welcome to the Masterportal Documentation (%s)\n' "$RELEASE_TAG" > docs/_snippets/index_title.md
                        - git add docs/_snippets/index_title.md
                        - 'git commit -m "docs: update mkdocs title snippet for $RELEASE_TAG" || echo "No changes to commit"'
                        - git push origin HEAD
                        - mike deploy $RELEASE_TAG
                        - mv $BITBUCKET_CLONE_DIR/site $BITBUCKET_CLONE_DIR/$RELEASE_TAG
                        -   pipe: atlassian/ftp-deploy:0.7.1
                            variables:
                                USER: $MKDOCS_FTP_NAME
                                PASSWORD: $MKDOCS_FTP_PW
                                SERVER: $MKDOCS_FTP_SERVER
                                REMOTE_PATH: '/$RELEASE_TAG'
                                LOCAL_PATH: $BITBUCKET_CLONE_DIR/$RELEASE_TAG
                                DEBUG: 'true'
                                DELETE_FLAG: 'false'
                        - echo "Upload Latest for LTS release ($RELEASE_TAG)."
                        - mv $BITBUCKET_CLONE_DIR/$RELEASE_TAG $BITBUCKET_CLONE_DIR/Latest
                        - find "$BITBUCKET_CLONE_DIR/Latest" -type f | while read -r file; do
                            rel_path="${file#$BITBUCKET_CLONE_DIR/Latest/}"
                            curl --user "$MKDOCS_FTP_NAME:$MKDOCS_FTP_PW" --ftp-create-dirs -T "$file" "ftp://$MKDOCS_FTP_SERVER/Latest/$rel_path"
                          done